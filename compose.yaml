services:
  sector-ai:
    image: ghcr.io/roryeckel/sector-ai:latest
    container_name: sector-ai
    restart: unless-stopped
    # .env holds TELEGRAM_BOT_TOKEN and, for this compose file, an OLLAMA_URL of
    # http://host.docker.internal:11434 so the container can reach Ollama on the
    # host. For an OpenAI-compatible backend, set SECTOR_AI_LLM_PROVIDER=openai
    # and SECTOR_AI_OPENAI_BASE_URL to the same host with /v1 appended.
    # `extra_hosts` makes that name resolve on Linux as well as Docker Desktop.
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
