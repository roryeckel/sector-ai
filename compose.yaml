services:
  sector-ai:
    image: ghcr.io/roryeckel/sector-ai:latest
    container_name: sector-ai
    restart: unless-stopped
    # .env holds TELEGRAM_BOT_TOKEN and, for this compose file, an OLLAMA_URL of
    # http://host.docker.internal:11434 so the container can reach Ollama on the
    # host. `extra_hosts` makes that name resolve on Linux as well as Docker
    # Desktop.
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
