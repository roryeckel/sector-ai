[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-ai"
version = "1.4.1"
description = "Python Telegram Bot powered by LangChain, Ollama or any OpenAI-compatible endpoint"
authors = [
    { name = "Rory Eckel" }
]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["telegram", "bot", "ollama", "openai", "langchain", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent"
]
dependencies = [
    "langchain-core==1.8.4",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.8.5",
    "python-telegram-bot==22.8",
    "svglib==2.4.0",
    "reportlab==5.1.0",
    "pypdfium2==5.15.2",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "httpx==0.28.1"
]

[project.scripts]
sector-ai = "sector_ai.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "packaging==26.3"
]

[project.urls]
Homepage = "https://github.com/roryeckel/sector-ai"
Issues = "https://github.com/roryeckel/sector-ai/issues"
Changelog = "https://github.com/roryeckel/sector-ai/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long - many existing lines exceed 100 chars

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["sector_ai"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
