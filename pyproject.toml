[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-ai"
version = "1.2.0"
description = "Python Telegram Bot powered by LangChain and Ollama"
authors = [
    { name = "Rory Eckel" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "langchain==1.2.10",
    "langchain-ollama==1.0.1",
    "python-telegram-bot==22.6",
    "svglib==1.6.0",
    "reportlab==4.4.10",
    "pydantic==2.12.5",
    "requests==2.32.5"
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.5",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0"
]

[project.urls]
Homepage = "https://github.com/roryeckel/sector-ai"
Issues = "https://github.com/roryeckel/sector-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long - many existing lines exceed 100 chars

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
