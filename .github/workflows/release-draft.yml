name: Release draft

# Stage 2 of the release pipeline (docs/RELEASES.md): when a release PR merges,
# verify the merge commit and create a DRAFT release. A draft materialises no
# tag, so deleting it leaves nothing public. Publishing it is stage 3.
#
# The dispatch inputs are the recovery path for a draft deleted after the PR
# merged.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 1.4.0)"
        required: true
        type: string
      target_ref:
        description: "Commit or ref the release points at"
        required: false
        default: master
        type: string
      previous_tag:
        description: "Override the previous tag used for the notes range"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Resolve the version and the target commit
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.target_ref }}
          INPUT_DRAFT: ${{ inputs.draft }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            REF="$INPUT_REF"
            DRAFT="$INPUT_DRAFT"
          else
            if [[ "$PR_HEAD_REF" != release/v* ]]; then
              echo "expected a release/v branch, got '$PR_HEAD_REF'" >&2
              exit 1
            fi
            VERSION="${PR_HEAD_REF#release/v}"
            REF="$PR_MERGE_SHA"
            DRAFT=true
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "release PR has no merge commit; refusing to release an unpinned commit" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "not a release version: $VERSION" >&2
            exit 1
          fi
          DRAFT="$(printf '%s' "${DRAFT:-true}" | tr '[:upper:]' '[:lower:]')"
          if [ "$DRAFT" != "true" ] && [ "$DRAFT" != "false" ]; then
            echo "draft must be true or false, got '$DRAFT'" >&2
            exit 1
          fi
          printf 'version=%s\nref=%s\ndraft=%s\n' "$VERSION" "$REF" "$DRAFT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: The version carriers agree with the release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python scripts/version.py check "$VERSION"

      - name: Test the release commit
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          pytest --cov --cov-fail-under=95

      - name: Resolve the previous tag
        id: prev
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          TAG="${PREVIOUS_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          fi
          # A case pattern, not grep: inside an ERE bracket expression "\r" and
          # "\n" are the literal letters, which would reject v1.4.0-rc.1.
          case "$TAG" in
            *$'\r'* | *$'\n'*)
              echo "previous tag must not contain line breaks" >&2
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update the draft release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DRAFT: ${{ steps.meta.outputs.draft }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TAG="v$VERSION"
          FLAGS=(--target "$SHA" --title "$TAG")
          if [ -n "$PREV" ]; then
            FLAGS+=(--notes-start-tag "$PREV")
          fi
          if [ "$DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if printf '%s' "$VERSION" | grep -qE -- '-'; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it alone"
          else
            gh release create "$TAG" "${FLAGS[@]}" --generate-notes --repo "$REPOSITORY"
          fi
          echo "release=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the release branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$HEAD_REF" || echo "branch already gone"
